[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sinkhorn-transport-diagnostics"
version = "0.1.0"
description = "Log-domain optimal transport with feasibility, duality, and self-cost diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
transport-audit = "transport_audit.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
